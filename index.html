<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Europe Climate Risk 2050</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="app/core.css">
</head>
<body>
<div id="app"><aside id="panel"></aside><div id="map"></div></div>
<div id="legend"></div>
<div id="banner">This map needs a small local web server. Double-click <b>start.command</b> in the map folder.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/layers.js"></script>
<script src="data/cities.js"></script>
<script src="data/base.js"></script>
<script src="app/core.js"></script>
<script>
// Classic: every hazard in its own colour, or one weighted score, on the site's sand base map.
const COL = { tx: '#d7301f', tn: '#c51b7d', hd35: '#7f0000', tr: '#6a0177', ws: '#8c510a', pra: '#d69e00', spei: '#e06c00',
  cdd: '#9c6b30', rfs: '#2171b5', rfc: '#08306b', cfs: '#6a51a3', rx5: '#1d91c0' };
const SEQ = ['#fdeee4', '#fbd0b9', '#f6a582', '#ee7650', '#d84a2f', '#b02a1f', '#7a1414'];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const RAMP = Array.from({ length: 101 }, (_, i) => {
  const s = SEQ.map(hex), t = i / 100 * (s.length - 1), a = Math.floor(t), b = Math.min(a + 1, s.length - 1);
  return s[a].map((c, j) => Math.round(c + (s[b][j] - c) * (t - a)));
});
const sw = c => `<svg class="gl" viewBox="0 0 18 12"><rect x="3" y="1" width="12" height="10" fill="${c}"/></svg>`;

CM.start({
  title: 'Climate risk, 2050', inkOverlays: false,
  modes: [{ id: 'own', label: 'Own colours' }, { id: 'score', label: 'One score' }],
  glyph: l => sw(COL[l.id]),
  paint(o, { sel, F, n, combine }) {
    if (CM.st.mode === 'score') {
      const S = combine();
      for (let p = 0; p < n * n; p++) if (S[p] >= 0) { // low scores fade into the sand instead of painting it pale
        const c = RAMP[Math.round(S[p] * 100)]; o[p * 4] = c[0]; o[p * 4 + 1] = c[1]; o[p * 4 + 2] = c[2]; o[p * 4 + 3] = 40 + 185 * S[p]; }
      return;
    }
    const C = sel.map(l => hex(COL[l.id]));
    for (let p = 0; p < n * n; p++) {
      let r = 0, g = 0, b = 0, a = 0;
      for (let i = 0; i < sel.length; i++) {
        const s = F[i] ? F[i][p] : -1;
        if (s <= .02) continue;
        const al = .15 + .7 * s, k = a * (1 - al), na = al + k;
        r = (C[i][0] * al + r * k) / na; g = (C[i][1] * al + g * k) / na; b = (C[i][2] * al + b * k) / na; a = na;
      }
      if (a) { o[p * 4] = r; o[p * 4 + 1] = g; o[p * 4 + 2] = b; o[p * 4 + 3] = a * 230; }
    }
  },
  legend(sel) {
    if (CM.st.mode === 'score') return `<div class="scale">${SEQ.map(c => `<span style="background:${c}"></span>`).join('')}</div>
      <div class="ticks"><span>0 low</span><span>score</span><span>100 severe</span></div>
      <div class="fn">${sel.map(l => l.name).join(', ')}</div>`;
    return sel.map(l => `<div class="row">${sw(COL[l.id])}<span class="nm">${l.name}</span><span class="rg">${CM.rangeLabel(l)}</span></div>`).join('')
      + '<div class="fn">Stronger colour = worse. Colours mix where hazards overlap.</div>';
  },
});
</script>
</body>
</html>
