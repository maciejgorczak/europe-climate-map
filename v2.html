<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Climate Risk - Survey Contours</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="app/core.css">
</head>
<body>
<div id="app"><aside id="panel"></aside><div id="map"></div></div>
<div id="legend"></div>
<div id="banner">This map needs a small local web server. Double-click <b>start.command</b> in the map folder.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/layers.js"></script><script src="data/cities.js"></script><script src="data/base.js"></script>
<script src="app/core.js"></script>
<script>
/* 2 - Survey contours. The weighted score of the selected hazards is treated as terrain: one contour every
   10 points, a heavier index contour every 50, and the 60 line - the "watch" line - as the single olive mark.
   A fine stipple carries the tone, so slopes and plateaus read even between the lines. */
const STEP = 10, WATCH = 60;
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const line = (w, c, dash) => `<svg class="gl" viewBox="0 0 18 12"><path d="M1 8 C5 2, 11 10, 17 4" fill="none" stroke="${c}" stroke-width="${w}" ${dash || ''}/></svg>`;

CM.start({
  title: 'Survey contours', eyebrow: 'Climate risk 2050 · version 2', weights: 'always', coarsen: 2,
  defaultOn: ['tx', 'tn', 'ws', 'pra'],
  glyph: (l, i) => i < 0 ? '' : `<svg class="gl" viewBox="0 0 18 12"><circle cx="9" cy="6" r="2" fill="var(--ink)"/></svg>`,
  paint(o, { n, R, co, combine }) {
    const S = combine(), ink = CM.col.ink, acc = CM.col.accent, gx0 = co.x * n, gy0 = co.y * n;
    const at = (i, j) => S[Math.max(0, Math.min(n - 1, j)) * n + Math.max(0, Math.min(n - 1, i))];
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      const p = j * n + i, s = S[p];
      if (s < 0) continue;
      let c = ink, a = 0;
      // stipple: dot density follows the score
      if (s > .15 && hash(gx0 + i, gy0 + j) < (s - .15) * .3) a = .5;
      // contours: distance to the nearest level = value offset / local gradient
      const v = s * 100 / STEP, lv = Math.round(v);
      if (lv > 1) { // no 10 line: it only rings small noise
        const l = at(i - 1, j), r = at(i + 1, j), u = at(i, j - 1), d = at(i, j + 1);
        if (l >= 0 && r >= 0 && u >= 0 && d >= 0) {
          const g = Math.hypot(r - l, d - u) * 50 / STEP, dist = Math.abs(v - lv) / Math.max(g, 1e-6);
          const watch = lv * STEP === WATCH, index = lv * STEP % 50 === 0;
          const w = R * (watch || index ? 1.7 : .8), cov = Math.max(0, Math.min(1, w / 2 - dist + .5));
          if (cov > 0) { a = Math.max(a, cov * (index || watch ? 1 : .8)); if (watch) c = acc; }
        }
      }
      if (a) { o[p * 4] = c[0]; o[p * 4 + 1] = c[1]; o[p * 4 + 2] = c[2]; o[p * 4 + 3] = a * 255; }
    }
  },
  legend(sel) {
    return `<div class="row">${line(.8, 'var(--ink)')}<span class="nm">Contour</span><span class="rg">every 10</span></div>
      <div class="row">${line(1.7, 'var(--ink)')}<span class="nm">Index contour</span><span class="rg">50</span></div>
      <div class="row">${line(1.7, 'var(--accent)')}<span class="nm">Watch line</span><span class="rg">60</span></div>
      <div class="fn">Score 0-100 of ${sel.map(l => l.name.toLowerCase()).join(', ')}. Denser dots and tighter lines = higher, faster-rising risk.</div>`;
  },
});
</script>
</body>
</html>
